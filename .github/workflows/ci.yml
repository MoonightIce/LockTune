name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    # The Island's glass host references NSGlassEffectView directly, which only
    # exists in the macOS 26 SDK. @available guards runtime availability but not
    # the compile-time symbol, so an older SDK fails to find the type at all.
    # macos-26 is arm64-only; building x86_64 stays a cross-compile, which is
    # what the local Apple Silicon build already does.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Test core package
        run: swift test

      - name: Build Universal macOS app
        run: scripts/build-app.sh Release 'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO

      - name: Verify Universal architectures
        run: |
          binary="$GITHUB_WORKSPACE/.build/XcodeDerivedData/Build/Products/Release/LockTune.app/Contents/MacOS/LockTune"
          architectures="$(lipo -archs "$binary")"
          [[ "$architectures" == *arm64* && "$architectures" == *x86_64* ]]
